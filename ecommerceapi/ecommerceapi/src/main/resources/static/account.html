<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | ShopEase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Sign In to Your Account</h1>
        <nav>
            <ul>
                <li><a href="landing.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</span></li>
                <li><a href="signup.html">Don't have an account? Sign up</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form class="login-form">
            <div>
                <label for="login-email">Email address:</label>
                <input type="email" id="login-email" name="username" required>
            </div>

            <div>
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" name="password" required>
            </div>

            <button type="submit">Sign In</button>
        </form>
        
        <p>New here? <a href="signup.html">Create an account →</a></p>
    </main>
    
    <hr>
    <footer>
        <p><a href="landing.html">Home</a> | <a href="products.html">Shop</a> | <a href="signup.html">Sign Up</a></p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
