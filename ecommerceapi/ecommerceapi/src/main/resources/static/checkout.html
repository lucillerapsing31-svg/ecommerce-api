<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ShopEase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="landing.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="products.html?category=clothing">Clothing</a></li>
                <li><a href="products.html?category=electronics">Electronics</a></li>
                <li><a href="products.html?category=books">Books</a></li>
                <li><a href="products.html?category=sale">Sale</a></li>
                <li><a href="cart.html">Cart</a> <span id="cart-count"></span></li>
                <li><a href="account.html">Account</a></li>
            </ul>
        </nav>
    </header>
    
    <h1>Checkout</h1>
    
    <div class="checkout-container">
        <div class="checkout-form">
            <form id="checkout-form">
                <fieldset>
                    <legend>Shipping Address</legend>
                    
                    <label for="name">Full name:</label>
                    <input type="text" id="name" name="name">
                    
                    <label for="street">Street address:</label>
                    <input type="text" id="street" name="street">
                    
                    <label for="zip">ZIP / Postal code:</label>
                    <input type="text" id="zip" name="zip">
                </fieldset>
                
                <fieldset>
                    <legend>Payment Method</legend>
                    
                    <label><input type="radio" name="payment" value="credit"> Credit Card</label><br>
                    <label><input type="radio" name="payment" value="paypal"> PayPal</label><br>
                    <label><input type="radio" name="payment" value="bank"> Bank Transfer</label><br>
                </fieldset>
                
                <button type="submit">Place Order</button>
            </form>
        </div>
        
        <aside class="order-summary">
            <h2>Order Summary</h2>
            <div id="order-items-list"></div>
            <hr>
            <p>Subtotal: $<span class="items-total">0.00</span></p>
            <p>Shipping: $<span class="shipping-cost">0.00</span></p>
            <p><strong>Total: $<span class="total-amount">0.00</span></strong></p>
        </aside>
    </div>
    
    <hr>
    <footer>
        <p><a href="cart.html">← Back to cart</a> | <a href="products.html">Continue shopping</a> | <a href="account.html">My Account</a></p>
    </footer>
    
    <script src="script.js"></script>
<script>


//PROTECT CHECKOUT PAGE
document.addEventListener('DOMContentLoaded', async () => {
    // Check if user is logged in
    const isLoggedIn = await checkAuth();
    if (!isLoggedIn) {
        // If not logged in, redirect to login
        window.location.href = "login.html";
        return;
    }

    // IF LOGGED IN, LOAD CHECKOUT CONTENT
    loadOrderSummary();
    updateCartCount();
});

// LOAD ORDER SUMMARY FROM CART
function loadOrderSummary() {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    const orderList = document.getElementById('order-items-list');
    const subtotalEl = document.querySelector('.items-total');
    const shippingEl = document.querySelector('.shipping-cost');
    const totalEl = document.querySelector('.total-amount');

    if(cart.length === 0) {
        orderList.innerHTML = '<p>Your cart is empty.</p>';
        subtotalEl.textContent = '0.00';
        shippingEl.textContent = '0.00';
        totalEl.textContent = '0.00';
        return;
    }

    // Fetch product details to show names/prices
    fetchWithAuth(API_BASE_URL)
    .then(res => res.json())
    .then(result => {
        const allProducts = result.content || result;
        let html = '';
        let subtotal = 0;

        cart.forEach(item => {
            const product = allProducts.find(p => p.id == item.id);
            if(product) {
                const price = product.price || 0;
                const amount = price * item.quantity;
                subtotal += amount;
                html += `
                    <div class="order-item">
                        <span>${product.name} x ${item.quantity}</span>
                        <span>₱${amount.toFixed(2)}</span>
                    </div>
                `;
            }
        });

        const shipping = subtotal > 0 ? 50.00 : 0; // Example shipping cost
        const total = subtotal + shipping;

        orderList.innerHTML = html;
        subtotalEl.textContent = subtotal.toFixed(2);
        shippingEl.textContent = shipping.toFixed(2);
        totalEl.textContent = total.toFixed(2);
    });
}

// HANDLE FORM SUBMIT
document.getElementById('checkout-form').addEventListener('submit', function(e) {
    e.preventDefault();
    alert('✅ Order placed successfully! Thank you for shopping.');
    localStorage.removeItem('cart');
    updateCartCount();
    window.location.href = "products.html";
});
</script>
</body>
</html>
